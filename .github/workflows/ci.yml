# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

on:
  pull_request:
  push:
  # The static PHP build the quick-launch script pins can be pulled upstream;
  # a weekly run notices that without waiting for a push.
  schedule:
    - cron: '0 6 * * 1'

name: CI

jobs:

  tests:
    name: Tests on PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4']
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer

      - name: Get composer cache directory
        id: composer-cache
        run: echo "::set-output name=dir::$(composer config cache-files-dir)"

      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Run static analysis
        run: composer phpstan

      - name: Run tests
        run: vendor/bin/phpunit

      - name: Run documentation snippets against the Phel runtime
        run: composer test:snippets

  quick-launch:
    name: Quick launch script on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest]
    steps:
      - uses: actions/checkout@v6

      - name: Lint the script
        if: matrix.os == 'ubuntu-latest'
        run: shellcheck static/get

      - name: Download PHP and Phel, report the version
        run: bash static/get --version

      - name: Evaluate an expression
        run: |
          out="$(bash static/get eval '(+ 1 2)' | perl -pe 's/\e\[[0-9;]*m//g')"
          test "$out" = "3" || { echo "expected 3, got: $out"; exit 1; }

      - name: Reuse the cached download
        run: bash static/get --version

      - name: Sourced mode puts phel on PATH (bash)
        run: bash -c 'source static/get && phel --version'

      - name: Sourced mode puts phel on PATH (zsh)
        if: runner.os == 'macOS'
        run: zsh -c 'source static/get && phel --version'

      - name: Pinning PHEL_VERSION resolves that release
        run: |
          out="$(PHEL_VERSION=0.50.0 bash static/get --version)"
          case "$out" in *0.50.0*) ;; *) echo "expected 0.50.0, got: $out"; exit 1 ;; esac

      - name: A failed download must not abort the sourcing shell
        run: |
          out="$(bash -c 'PHP_VERSION=9.9.9 source static/get; echo still-alive' 2>/dev/null)"
          case "$out" in *still-alive*) ;; *) echo "sourcing killed the shell"; exit 1 ;; esac

  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          coverage: none
          tools: composer

      - name: Install PHP dependencies
        run: composer install --no-interaction --no-ansi --no-progress

      - name: Generate API documentation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: composer build

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Node.js dependencies
        run: npm ci

      - name: Build CSS
        run: npm run build-css-prod

      - name: Install Zola
        run: |
          ZOLA_VERSION="0.22.1"
          curl -sL "https://github.com/getzola/zola/releases/download/v${ZOLA_VERSION}/zola-v${ZOLA_VERSION}-x86_64-unknown-linux-gnu.tar.gz" | tar xz -C /usr/local/bin

      - name: Build site
        run: zola build

      - name: Check internal links
        run: zola check --skip-external-links
