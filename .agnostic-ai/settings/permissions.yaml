# Codex gets the same policy as exec-policies in agnostic-ai.yaml.
targets: [claude]
permissions:
  allow:
    - shell(composer:*)
    - shell(npm run:*)
    - shell(npm ci)
    - shell(zola:*)
    - shell(php build/:*)
    - shell(./vendor/bin/:*)
    - shell(vendor/bin/:*)
    - shell(agnostic-ai:*)
    - shell(git status:*)
    - shell(git diff:*)
    - shell(git log:*)
    - shell(git show:*)
    - shell(gh run:*)
    - shell(gh pr view:*)
    - shell(gh issue view:*)
  ask:
    - shell(git push:*)
  deny:
    - shell(rm -rf /:*)
    - shell(rm -rf ~:*)
    - shell(sudo:*)
