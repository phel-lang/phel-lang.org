{% if page.toc %}
<details class="page-toc-mobile">
    <summary>On this page</summary>
    <nav aria-label="On this page">
        <ul>
            {% for h1 in page.toc %}
            <li>
                <a href="#{{ h1.id }}">{{ h1.title }}</a>
                {% if h1.children %}
                <ul>
                    {% for h2 in h1.children %}
                    <li>
                        <a href="#{{ h2.id }}">{{ h2.title }}</a>
                    </li>
                    {% endfor %}
                </ul>
                {% endif %}
            </li>
            {% endfor %}
        </ul>
    </nav>
</details>
{% endif %}
